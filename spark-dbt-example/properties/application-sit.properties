# Replace project code/name with the existing SIT project before apply.
# generate accepts code=0 for offline preview; apply requires a positive real code.
ds.api.url=http://127.0.0.1:12345/dolphinscheduler
ds.project.code=0
ds.project.name=spark_sql_example
# API token from this environment file; required for apply, optional for generate.
ds.api.token=
ds.worker.group=default
ds.tenant.code=default
ds.environment.code=-1
ds.warning.type=NONE
ds.warning.group.id=0
# false creates an OFFLINE schedule and disables older managed schedules on apply.
ds.schedule.enabled=false
spark.project.dir=/opt/spark/spark-dbt-example
