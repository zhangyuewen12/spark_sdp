name: hudi_compaction_batch
job-type: hudi-compaction
configuration:
  hoodie.cleaner.commits.retained: "20"
  hoodie.keep.min.commits: "30"
  hoodie.keep.max.commits: "50"
spark-submit:
  master: yarn
  deploy-mode: cluster
  queue: default
  driver.memory: 2g
  executor.memory: 4g
  executor.cores: "2"
  executor.num: "2"
