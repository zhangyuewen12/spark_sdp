name=sql_orders_pipeline
libraries=transformations

# Pipeline-wide Spark SQL configuration applied by the SDP runtime.
configuration.spark.sql.shuffle.partitions=1

# spark-submit resource options read by bin/spark-sdp.sh when submitting by job name.
master=yarn
deploy-mode=cluster
queue=default
driver.memory=1g
executor.memory=1g
executor.cores=1
executor.num=1
